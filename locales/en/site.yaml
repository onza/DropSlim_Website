install:
  macos:
    heading: macOS
    requirements: macOS 11 (Big Sur) or later, Apple Silicon (M1 or newer)
    steps:
      - Download the DMG file.
      - Open the DMG and drag DropSlim to Applications.
      - Open DropSlim from Applications.
  windows:
    heading: Windows
    requirements: Windows 10 or later (64-bit)
    steps:
      - Download the setup EXE.
      - If your browser blocks the download, choose Keep or Keep anyway.
      - Run the installer.
      - If SmartScreen shows "Windows protected your PC", click More info, then Run anyway.
      - Follow the setup wizard and start DropSlim from the Start menu or desktop shortcut.
  cli:
    heading: CLI (macOS)
    requirements: macOS 11 (Big Sur) or later, Apple Silicon (M1 or newer)
    intro: Command-line tool for batch compression — same engine as the app, no GUI.
    commands:
      - brew tap onza/tap
      - brew install dropslim
      - dropslim compress photo.png images/
    steps:
      - Run dropslim compress --help for output folder, format, max dimensions, and JSON output.
    note: |
      Or download **`dropslim-cli_*_aarch64.tar.gz`** from [GitHub Releases](https://github.com/onza/DropSlim/releases).
